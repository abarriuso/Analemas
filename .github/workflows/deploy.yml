# Despliegue a GitHub Pages. Único workflow que publica.
#
# Cambios:
#  1. Job `verify` previo: si la validación orbital, el smoke test o el lint
#     fallan, NO se despliega. Antes deploy.yml publicaba sin comprobar nada.
#  2. `permissions: {}` a nivel de workflow. Cada job pide solo lo suyo.
#     `pages: write` vive únicamente en el job `deploy`, que no instala ni
#     ejecuta código de terceros: se limita a publicar el artefacto.
#     (Mismo patrón que melanoma-detection-vgg16/deploy.yml.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: node validacion.mjs
      - run: node smoke-test.cjs
      - run: pnpm lint

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
